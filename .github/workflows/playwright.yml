# Chạy bộ test Playwright trên máy ảo của GitHub (runner)
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 6h00 sáng thứ Hai giờ Việt Nam. Không có dòng timezone thì cron tính theo giờ UTC
    - cron: '0 6 * * 1'
      timezone: 'Asia/Ho_Chi_Minh'
  # Nút "Run workflow" để bấm chạy tay trên tab Actions
  workflow_dispatch:

# Push liên tiếp lên cùng một nhánh: huỷ lượt cũ đang chạy, chỉ giữ lượt mới nhất
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test CRM (Chromium)
    runs-on: ubuntu-latest
    # Treo quá 30 phút thì GitHub dừng job (mặc định tới 360 phút)
    timeout-minutes: 30
    env:
      # Repo không có file .env.dev: biến thường ghi thẳng ở đây, tài khoản lấy từ Secrets
      ENV_NAME: GitHub Actions
      CRM_URL: https://crm.anhtester.com
      BOOK_URL: https://book.anhtester.com
      # CRM demo dùng chung: tối đa 4 worker
      WORKERS: 4
      CRM_ADMIN_EMAIL: ${{ secrets.CRM_ADMIN_EMAIL }}
      CRM_ADMIN_PASSWORD: ${{ secrets.CRM_ADMIN_PASSWORD }}
      CRM_PM_EMAIL: ${{ secrets.CRM_PM_EMAIL }}
      CRM_PM_PASSWORD: ${{ secrets.CRM_PM_PASSWORD }}
      CRM_CUSTOMER_EMAIL: ${{ secrets.CRM_CUSTOMER_EMAIL }}
      CRM_CUSTOMER_PASSWORD: ${{ secrets.CRM_CUSTOMER_PASSWORD }}
    steps:
      - name: Lấy code của repo
        uses: actions/checkout@v7

      - name: Cài Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci cài đúng phiên bản trong package-lock.json
      - name: Cài thư viện
        run: npm ci

      # Playwright chạy file .ts mà không kiểm kiểu: sai kiểu thì dừng ở đây, chưa tốn công cài trình duyệt
      - name: Kiểm kiểu TypeScript
        run: npm run typecheck

      # Chỉ cài Chromium (và thư viện hệ điều hành nó cần) vì CI chỉ chạy project chromium
      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      # Đăng nhập CRM 3 vai trò, lưu phiên ra playwright/.auth/.
      # --reporter=list: bước này KHÔNG ghi HTML Report, Allure (các bước Fill "..." có mật khẩu)
      - name: Đăng nhập CRM (project setup)
        run: npx playwright test --project=setup --reporter=list

      # Chỉ test CRM. --no-deps: đã đăng nhập ở bước trên, và không chạy api-setup của Book
      - name: Chạy test CRM trên Chromium
        run: npx playwright test crm- --project=chromium --no-deps

      # !cancelled(): test đỏ vẫn sinh và upload report. Chỉ bỏ qua khi lượt chạy bị huỷ.
      # hashFiles: chưa có allure-results (đăng nhập đỏ, bước test không chạy) thì không sinh
      - name: Sinh Allure Report
        if: ${{ !cancelled() && hashFiles('allure-results/**') != '' }}
        run: npm run allure:generate

      - name: Lưu HTML Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Lưu Allure Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
